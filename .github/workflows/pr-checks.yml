# ============================================================
# PR Checks — runs on every PR targeting main
# Builds and tests all three apps. No deployment.
# A failed check blocks the PR from merging (enforce this in
# GitHub: Settings → Branches → Branch protection rules →
# "Require status checks to pass before merging")
# ============================================================

name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  # ----------------------------------------------------------
  # .NET API — build + unit + integration tests
  # ----------------------------------------------------------
  api:
    name: API — Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: |
          dotnet restore ApexAPI/src/Apex.API.Web/Apex.API.Web.csproj
          dotnet restore ApexAPI/tests/Apex.API.UnitTests/Apex.API.UnitTests.csproj
          dotnet restore ApexAPI/tests/Apex.API.IntegrationTests/Apex.API.IntegrationTests.csproj

      - name: Build
        run: |
          dotnet build ApexAPI/src/Apex.API.Web/Apex.API.Web.csproj -c Release --no-restore
          dotnet build ApexAPI/tests/Apex.API.UnitTests/Apex.API.UnitTests.csproj -c Release --no-restore
          dotnet build ApexAPI/tests/Apex.API.IntegrationTests/Apex.API.IntegrationTests.csproj -c Release --no-restore

      - name: Unit Tests
        run: |
          dotnet test ApexAPI/tests/Apex.API.UnitTests/Apex.API.UnitTests.csproj \
            --no-build -c Release \
            --logger "console;verbosity=normal"

      - name: Integration Tests
        run: |
          dotnet test ApexAPI/tests/Apex.API.IntegrationTests/Apex.API.IntegrationTests.csproj \
            --no-build -c Release \
            --logger "console;verbosity=normal"

  # ----------------------------------------------------------
  # React App — TypeScript check + Vite build
  # "tsc && vite build" catches type errors as well as bundle errors.
  # VITE_API_URL is not needed for a build check — Vite will use
  # an empty string if the var is unset, which is fine for CI.
  # ----------------------------------------------------------
  app:
    name: App — TypeScript & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ApexApp/package-lock.json

      - name: Install
        working-directory: ApexApp
        run: npm ci

      - name: Build (TypeScript + Vite)
        working-directory: ApexApp
        run: npm run build

  # ----------------------------------------------------------
  # Marketing Site — TypeScript check + Next.js build
  # RESEND_API_KEY and CONTACT_EMAIL are not needed at build time —
  # they're only used at runtime in the API route handler.
  # ----------------------------------------------------------
  marketing:
    name: Marketing — TypeScript & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Apex/package-lock.json

      - name: Install
        working-directory: Apex
        run: npm ci

      - name: Build
        working-directory: Apex
        run: npm run build
